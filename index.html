<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Landing Page</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #f8fafc;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .card {
    max-width: 560px;
  }
  h1 {
    font-size: 2.5rem;
    margin-bottom: 12px;
  }
  p {
    font-size: 1.1rem;
    color: #cbd5e1;
    line-height: 1.6;
  }
  .badge {
    display: inline-block;
    margin-top: 24px;
    padding: 6px 14px;
    background: #22c55e;
    color: #052e16;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.9rem;
  }
  .version {
    margin-top: 16px;
    font-size: 0.85rem;
    color: #64748b;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🚀 Hello, Vercel!</h1>
    <p>이 페이지는 GitHub → Vercel 자동 배포 테스트용 랜딩 페이지입니다.</p>
    <span class="badge">v1</span>
    <p class="version">Last updated: 2026-07-28</p>
  </div>
</body>
</html>
